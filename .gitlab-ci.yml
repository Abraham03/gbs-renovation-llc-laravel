# CI/CD: despliegue automatico a Hostinger (hosting compartido).
#
# Variables requeridas en GitLab (Settings > CI/CD > Variables), todas "Protected":
#   SSH_PRIVATE_KEY  clave privada SSH codificada en base64, en una sola linea
#   SSH_HOST         host SSH de Hostinger
#   SSH_USER         usuario SSH (u525153682)
#   SSH_PORT         puerto SSH (en hosting compartido suele ser 65002)

stages:
  - build
  - deploy
  - migrate

variables:
  DEPLOY_PATH: "/home/u525153682/domains/gbsrenovationsllc.services/public_html/api"
  APP_URL: "https://api.gbsrenovationsllc.services"
  # Ruta absoluta a PHP 8.3: el `php` del PATH puede apuntar a otra version
  PHP_BIN: "/opt/alt/php83/usr/bin/php"

# ---------------------------------------------------------------- build

build:vendor:
  stage: build
  image: composer:2
  script:
    # composer.lock fija las versiones, asi que no hay resolucion de dependencias.
    # El runner solo descarga paquetes (no ejecuta la app), por eso es seguro
    # ignorar los requisitos de plataforma como ext-gd o ext-exif.
    - composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --ignore-platform-reqs
    - composer dump-autoload --no-dev --optimize --ignore-platform-reqs
  artifacts:
    expire_in: 1 hour
    paths:
      - vendor/

build:assets:
  stage: build
  image: node:22-alpine
  script:
    # npm ci instala exactamente las versiones de package-lock.json
    - npm ci --ignore-scripts
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - public/build/

# ---------------------------------------------------------------- deploy

# Job oculto reutilizado via `extends`: prepara la clave SSH en el runner.
.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # La clave esta guardada en base64 (una sola linea), se decodifica aqui
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
    - |
      cat >> ~/.ssh/config <<CFG
      Host deploy
        HostName $SSH_HOST
        User $SSH_USER
        Port $SSH_PORT
        IdentityFile ~/.ssh/id_deploy
        IdentitiesOnly yes
      CFG
    - chmod 600 ~/.ssh/config

deploy:production:
  stage: deploy
  image: alpine:3.20
  extends: .ssh_setup
  needs:
    - build:vendor
    - build:assets
  environment:
    name: production
    url: https://api.gbsrenovationsllc.services
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # -rlvz en vez de -a: -a incluye permisos/owner/group, que en hosting
    # compartido fallan porque no somos duenos del uid remoto. -l se mantiene
    # para preservar symlinks.
    # --delete sin --delete-excluded: las rutas de .rsyncignore quedan protegidas
    # en el destino (.env, storage/, public/storage no se tocan).
    - rsync -rlvz --delete --exclude-from='.rsyncignore' ./ "deploy:$DEPLOY_PATH/"
    - |
      ssh deploy "
        set -e
        cd $DEPLOY_PATH
        $PHP_BIN artisan optimize:clear
        $PHP_BIN artisan package:discover
        [ -L public/storage ] || $PHP_BIN artisan storage:link
        $PHP_BIN artisan config:cache
        $PHP_BIN artisan view:cache
      "
    # No se usa `artisan optimize` porque incluye route:cache, que falla:
    # routes/web.php define la home con un closure y Laravel no puede serializarlo.
    - curl -fsS -o /dev/null -w "healthcheck /up -> %{http_code}\n" "$APP_URL/up"

# ---------------------------------------------------------------- migrate

# Job MANUAL: aparece con un boton play en el pipeline y espera a que le des clic.
# Si no lo ejecutas, el pipeline se marca igual como exitoso.
# `migrate` solo aplica las migraciones que faltan; no borra datos existentes.
migrate:production:
  stage: migrate
  image: alpine:3.20
  extends: .ssh_setup
  needs:
    - deploy:production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - ssh deploy "cd $DEPLOY_PATH && $PHP_BIN artisan migrate --force"
